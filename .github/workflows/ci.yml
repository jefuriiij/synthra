name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even if one fails — the whole point is catching
      # POSIX-vs-Windows regressions (e.g. the bash-hook bug Windows can't see).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check # Biome lint + format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
